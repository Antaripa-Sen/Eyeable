<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeAble — Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="auth-card">
    <div class="auth-logo">
      <h1>👁️ EyeAble</h1>
      <p>Eye-gaze communication for everyone</p>
    </div>

    <div class="tab-row">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="signupTab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="role-row" id="loginRoleRow">
        <div class="role-chip active" id="loginTeacherChip" onclick="setRole('teacher','login')">
          👩‍🏫 Teacher
        </div>
        <div class="role-chip" id="loginStudentChip" onclick="setRole('student','login')">
          👨‍🎓 Student
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>

      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:4px;" onclick="loginWithEmail()">
        Sign In
      </button>

      <div class="divider-line">or</div>

      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
        Continue with Google
      </button>

      <div class="error-msg" id="loginError"></div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" style="display:none;">
      <div class="role-row" id="signupRoleRow">
        <div class="role-chip" id="signupTeacherChip" onclick="setRole('teacher','signup')">
          👩‍🏫 Teacher
        </div>
        <div class="role-chip active" id="signupStudentChip" onclick="setRole('student','signup')">
          👨‍🎓 Student
        </div>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min. 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirmPassword" placeholder="Repeat password">
      </div>

      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:4px;" onclick="signupWithEmail()">
        Create Account
      </button>

      <div class="divider-line">or</div>

      <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
        Sign up with Google
      </button>

      <div class="error-msg" id="signupError"></div>
      <div class="success-msg" id="signupSuccess"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvOGMmLgbeZwpVpOAWeH5ilU077uOmz2s",
      authDomain: "eyeable-2026.firebaseapp.com",
      databaseURL: "https://eyeable-2026-default-rtdb.firebaseio.com",
      projectId: "eyeable-2026",
      storageBucket: "eyeable-2026.firebasestorage.app",
      messagingSenderId: "29944050006",
      appId: "1:29944050006:web:33515697c3aac35432e6f7"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let selectedRole = { login: 'teacher', signup: 'student' };

    auth.signOut();

    function switchTab(tab) {
      document.getElementById('loginTab').classList.toggle('active', tab === 'login');
      document.getElementById('signupTab').classList.toggle('active', tab === 'signup');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    }

    function setRole(role, form) {
      selectedRole[form] = role;
      const pfx = form === 'login' ? 'login' : 'signup';
      document.getElementById(pfx + 'TeacherChip').classList.toggle('active', role === 'teacher');
      document.getElementById(pfx + 'StudentChip').classList.toggle('active', role === 'student');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

    function toast(msg, type='info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = (type==='success'?'✓':type==='error'?'✗':'ℹ') + ' ' + msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    async function loginWithEmail() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      hideMsg('loginError');
      if (!email || !password) { showError('loginError', 'Please fill in all fields'); return; }
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const snap = await db.ref('users/' + cred.user.uid).once('value');
        const data = snap.val();
        if (data?.role) redirect(data.role);
        else { await db.ref('users/' + cred.user.uid).update({ role: selectedRole.login }); redirect(selectedRole.login); }
      } catch(e) {
        const msgs = { 'auth/user-not-found':'No account found with this email.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Invalid email address.','auth/invalid-credential':'Invalid email or password.' };
        showError('loginError', msgs[e.code] || e.message);
      }
    }

    async function signupWithEmail() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pw = document.getElementById('signupPassword').value;
      const pw2 = document.getElementById('signupConfirmPassword').value;
      hideMsg('signupError'); hideMsg('signupSuccess');
      if (!name || !email || !pw || !pw2) { showError('signupError','Please fill in all fields'); return; }
      if (pw.length < 6) { showError('signupError','Password must be at least 6 characters'); return; }
      if (pw !== pw2) { showError('signupError','Passwords do not match'); return; }
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pw);
        await cred.user.updateProfile({ displayName: name });
        await db.ref('users/' + cred.user.uid).set({ name, email, role: selectedRole.signup, createdAt: new Date().toISOString() });
        const el = document.getElementById('signupSuccess');
        el.textContent = 'Account created! Redirecting…';
        el.style.display = 'block';
        setTimeout(() => redirect(selectedRole.signup), 1400);
      } catch(e) {
        const msgs = { 'auth/email-already-in-use':'Email already registered.','auth/weak-password':'Password too weak.','auth/invalid-email':'Invalid email.' };
        showError('signupError', msgs[e.code] || e.message);
      }
    }

    async function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try {
        const result = await auth.signInWithPopup(provider);
        const snap = await db.ref('users/' + result.user.uid).once('value');
        if (!snap.exists()) {
          const form = document.getElementById('signupForm').style.display !== 'none' ? 'signup' : 'login';
          await db.ref('users/' + result.user.uid).set({ name: result.user.displayName, email: result.user.email, role: selectedRole[form], createdAt: new Date().toISOString() });
          redirect(selectedRole[form]);
        } else {
          redirect(snap.val().role);
        }
      } catch(e) {
        toast('Google sign-in failed: ' + e.message, 'error');
      }
    }

    function redirect(role) {
      localStorage.setItem('role', role);
      window.location.href = role === 'teacher' ? 'teacher.html' : 'index.html';
    }
  </script>
</body>
</html>
